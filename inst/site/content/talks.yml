  - title: The CORSTAT R Working Group - Swiss Statistics Meeting 2025
    event: Swiss Statistics Meeting 2025
    event_url: https://www.statistiktage.ch/en/
    date: '2025-11-06'
    location: Geneva, Switzerland
    description: 'Poster "The CORSTAT R Working Group: Expanding statistical collaboration
      in Switzerland" presented at the Swiss Statistics Meeting 2025 in Geneva.'
    abstract: |-
      The CORSTAT R Working Group was established to unite R experts from municipal and cantonal statistical offices across Switzerland, enhancing the application of the R programming language in statistical practices. Established at the end of 2023, the group has rapidly grown to become the largest CORSTAT working group, with nearly 40 members representing 20 statistical offices. While R remains the primary focus, the group is now expanding its scope to incorporate additional open-source programming languages such as Python and Julia, AI tools for coding, versioning systems and integrated development environments.

      The group aims to foster collaboration by not only sharing knowledge but also by developing and maintaining essential tools and resources. Its key objectives include creating a robust network for knowledge exchange, establishing a further education network for skill development, enhancing the quality of statistical outputs, and streamlining production processes through a national code base for shared use across various open-source programming languages. Activities involve peer reviewing and co-developing software packages, as well as ensuring their ongoing maintenance. We invite all interested statistical offices to join this initiative and contribute to enhancing the use of open-source programming languages in statistical work throughout Switzerland.
