  - title: I14Y R package Poster - Swiss Statistics Meeting 2025
    event: Swiss Statistics Meeting 2025
    event_url: https://www.statistiktage.ch/en/
    date: '2025-11-06'
    location: Geneva, Switzerland
    description: 'Poster "I14Y: An R package to access data from the Interoperability
      Platform of Switzerland" presented at the Swiss Statistics Meeting 2025 in Geneva.'
    abstract: |-
      Search and download I14Y data in multiple languages with 1 line of code.

      The I14Y R package provides access to Switzerland's national data catalogue, the Interoperability Platform (I14Y), enabling statisticians and data analysts to efficiently search and retrieve official Swiss metadata across federal, cantonal, and communal levels using the R programming language.

      The package leverages the platform's IOP API and Console API to offer comprehensive functionality including: searching for statistical concepts and nomenclatures, retrieving codelists (such as NOGA classifications), accessing dataset metadata and data structures, and downloading nomenclature levels—all available in four national languages (German, French, Italian, and English).

      A key strength is its complementary relationship with the BFS R package for Swiss Federal Statistical Office data. This poster demonstrates practical applications, including a use case where I14Y facilitates the translation of German NOGA division categories when analysing income data by profession and gender obtained through BFS, showcasing how the package enhances cross-linguistic statistical analysis.

      By simplifying access to Switzerland's centralized metadata repository with intuitive R functions, the I14Y R package participates to promote data harmonization and reduces barriers for statistical offices, researchers, and analysts working with Swiss official statistics. The package contributes to Switzerland's digital transformation in statistics, fostering better data discovery, understanding, and reuse across linguistic and institutional boundaries.

      The I14Y R package is an open source software hosted on both GitHub and CRAN, with comprehensive documentation available online. This accessibility ensures researchers and practitioners can easily access, contribute to, and implement the package in their data workflows.
