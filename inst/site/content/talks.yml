  - title: BFS R package - Search and download data from the Swiss Federal Statistical
      Office
    event: adminR Meetup
    event_url: https://www.meetup.com/fr-FR/adminr/events/293128972/
    date: '2023-05-25'
    location: Zürich, Switzerland
    description: Meetup organized by adminR, Digital Society Initiative DSI and the
      Statistical Office of Zürich.
    abstract: The BFS R package allows to explore and access Swiss public data in
      a dynamic and reproducible way. Users can discover the latest BFS datasets available,
      extract their metadata and download them in any language (German, French, Italian
      or English) directly from the R console.
