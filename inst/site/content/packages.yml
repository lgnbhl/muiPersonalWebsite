# The R packages band, and the honeycomb behind the hero.
#
# Every package states its own two URLs. The convention is `/{slug}/` for the reference and
# github.com/lgnbhl/{slug} for the source, but a package whose docs live somewhere else —
# CRAN, another organisation, a site of its own — says so on its own item rather than being
# left with a link that resolves nowhere.
defaults:
  fit: contain
items:
  - slug: muiMaterial
    title: muiMaterial R package
    description: Build 'Material UI' interfaces in 'shiny' and 'Quarto'
    image: muiMaterial-logo.png
    date: '2026-09-05'
    primary:
      label: Docs
      href: /muiMaterial/
    secondary:
      label: Source
      href: https://github.com/lgnbhl/muiMaterial
