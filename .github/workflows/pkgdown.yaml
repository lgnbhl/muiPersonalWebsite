## Builds the package reference into docs/, which this repository's GitHub Pages serve, and
## commits it when it changed. `destination: docs` in _pkgdown.yml is what puts it there.
##
## The personal site is a separate tree with a separate pipeline: build-site.yaml builds
## inst/site/ and publishes it into lgnbhl.github.io. The two shared docs/ once, and the
## clean rebuild at the end of that build deleted the reference on the way past.
on:
  push:
    branches: [main]
    # The commit this workflow makes must not start it again.
    paths-ignore:
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

concurrency:
  group: pkgdown
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # The vignettes are Rmd; pkgdown renders them through pandoc.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build the package reference
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Commit the built reference
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "the built reference is unchanged"
          else
            git commit -m "Build reference [skip ci]"
            git push
          fi
